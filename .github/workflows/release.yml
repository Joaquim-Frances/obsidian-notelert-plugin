name: Build and Prepare Download

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Permite ejecutar manualmente

jobs:
  build-and-prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para hacer push de los archivos compilados
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build plugin
        run: npm run build
      
      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Prepare release assets
        run: npm run release:assets

      - name: Upload plugin assets
        uses: actions/upload-artifact@v4
        with:
          name: notelert-plugin-assets
          path: |
            releases/main.js
            releases/manifest.json
            releases/styles.css
          retention-days: 90
      
      - name: Commit built files to repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dist/main.js dist/manifest.json
          git add releases/
          if ! git diff --staged --quiet; then
            git commit -m "Build: Update dist and releases files [skip ci]"
            git push
          else
            echo "No changes to commit in dist or releases files"
          fi
