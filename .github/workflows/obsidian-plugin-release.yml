name: Obsidian plugin release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish Obsidian plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/obsidian-plugin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/obsidian-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest version
        run: |
          node -e "const m=require('./manifest.json'); if (m.version !== process.env.GITHUB_REF_NAME) { throw new Error(`manifest version ${m.version} does not match tag ${process.env.GITHUB_REF_NAME}`); }"

      - name: Build plugin
        run: npm run build

      - name: Prepare release assets
        run: node scripts/create-release-zip.js

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            apps/obsidian-plugin/releases/main.js
            apps/obsidian-plugin/releases/manifest.json
            apps/obsidian-plugin/releases/styles.css

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_args=(--generate-notes)
          if [ -f "RELEASE_NOTES_v$GITHUB_REF_NAME.md" ]; then
            notes_args=(--notes-file "RELEASE_NOTES_v$GITHUB_REF_NAME.md")
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              releases/main.js \
              releases/manifest.json \
              releases/styles.css \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              releases/main.js \
              releases/manifest.json \
              releases/styles.css \
              --title "$GITHUB_REF_NAME" \
              "${notes_args[@]}"
          fi
